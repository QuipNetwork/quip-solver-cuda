stages: [toolchain, test, build, release]

include:
  - project: quip.network/ci-templates
    ref: v1.2.0
    file: templates/dependency-gate.yml

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Downloadable binaries live in the generic package registry under this name.
  PKG: quip-solver-cuda
  # The toolchain image the jobs run on, by digest. The
  # build-toolchain-image job prints this line after a rebuild.
  TOOLCHAIN_IMAGE: registry.gitlab.com/quip.network/quip-solver-cuda/ci-toolchain@sha256:5ebdbbd387d4a04a24a439f0ea2f43e41ba04e6ed161360807b8714758e7d885

default:
  tags: [linux, amd64]

cache:
  key: cargo-$CI_COMMIT_REF_SLUG
  paths: [.cargo/, target/]

# The cargo jobs run on the toolchain image (.gitlab/ci-toolchain.Dockerfile):
# the CUDA 12.9 toolkit that the crate's cuda-12090 pin targets, the build
# tools, and Rust 1.97.1. A CUDA-less image cannot catch a pin and toolkit
# mismatch. The image holds every tool the jobs used to install, so the jobs
# have no setup steps.
.toolchain:
  image: $TOOLCHAIN_IMAGE

# The toolchain image. Its Dockerfile says what it holds. This job runs on a
# branch push that changes the Dockerfile and is manual otherwise. The jobs
# pull the image by digest, so after a rebuild copy the digest this job prints
# into TOOLCHAIN_IMAGE in a commit of its own.
#
# The `docker` tag selects the Linux container executors, which run kaniko.
# Those hosts bind-mount GPU firmware into /lib, so kaniko cannot replace /lib
# with the base image's merged-usr symlink. It ignores /lib, and the shim
# keeps the ELF interpreter reachable for each RUN, as in quip-solver-cpu.
build-toolchain-image:
  stage: toolchain
  needs: []
  tags: [docker, amd64]
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.29.1-debug@sha256:ebc38a988e5aa1aaea99240e931aeeeff9d8e6bb5a0bd0e00eaf79973bf0a773
    entrypoint: [""]
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - .gitlab/ci-toolchain.Dockerfile
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - mkdir -p /lib && ln -sfn /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
    # The image copies no project files, so the build context is empty.
    - mkdir -p /tmp/toolchain-context
  script:
    - |
      /kaniko/executor \
        --context /tmp/toolchain-context \
        --dockerfile "$CI_PROJECT_DIR/.gitlab/ci-toolchain.Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE/ci-toolchain:$CI_COMMIT_SHORT_SHA" \
        --ignore-path=/lib \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/ci-toolchain-buildcache" \
        --digest-file=/tmp/digest
    - echo "TOOLCHAIN_IMAGE=$CI_REGISTRY_IMAGE/ci-toolchain@$(cat /tmp/digest)"

# The fast suite, on GPU hardware, on every pipeline. The `cuda` tag selects
# the GPU hosts (lovelace, finney), whose docker runners expose the devices.
# `--include-ignored` runs the GPU tests that are `#[ignore]`d for a plain
# `cargo test`, the arch_coverage support contract (every SUPPORTED_ARCHS entry
# NVRTC-compiles and ptxas-assembles), and the session conformance
# gates. nvidia-smi fails the job at once if the runner gave it no GPU.
# `make test-gpu` is the local equivalent.
test:
  extends: .toolchain
  stage: test
  tags: [linux, amd64, cuda]
  timeout: 30m
  variables:
    # libtest's --ensure-time is unstable and requires RUSTC_BOOTSTRAP.
    RUSTC_BOOTSTRAP: "1"
    RUST_TEST_TIME_UNIT: "10000,30000"
    RUST_TEST_TIME_INTEGRATION: "10000,30000"
    RUST_TEST_TIME_DOCTEST: "10000,30000"
  script:
    - nvidia-smi
    - cargo fmt --all --check
    - cargo clippy --release --all-targets --all-features -- -D warnings
    - cargo test --release -- --include-ignored --test-threads=1 -Z unstable-options --ensure-time

.build:
  stage: build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

build-amd64:
  extends: [.build, .toolchain]
  script:
    - cargo build --release --bins
    - mkdir -p dist
    - cp target/release/quip-cuda-sa dist/quip-cuda-sa-linux-amd64
    - cp target/release/quip-cuda-gibbs dist/quip-cuda-gibbs-linux-amd64
    - cp target/release/quip-cuda-msa dist/quip-cuda-msa-linux-amd64

# On a tag: upload every built binary to the generic package registry, then cut
# a Release linking them as downloadable assets.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for f in dist/*; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [{job: dependency-gate, optional: true}, upload]
  script:
    - |
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      release-cli create --name "quip-solver-cuda ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"quip-cuda-sa-linux-amd64\",\"url\":\"${base}/quip-cuda-sa-linux-amd64\"}" \
        --assets-link "{\"name\":\"quip-cuda-gibbs-linux-amd64\",\"url\":\"${base}/quip-cuda-gibbs-linux-amd64\"}" \
        --assets-link "{\"name\":\"quip-cuda-msa-linux-amd64\",\"url\":\"${base}/quip-cuda-msa-linux-amd64\"}"
